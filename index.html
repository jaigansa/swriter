<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWriter — Screenwriting Studio</title>
  <meta name="description" content="SWriter: an offline-first, browser-based screenwriting app built on Fountain with industry-standard screenplay PDF export." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-size='44' text-anchor='middle' fill='white' font-family='Courier,monospace' font-weight='bold'%3ESW%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar">
      <button id="btn-sidebar" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl+B)"></button>
      <span class="brand">SWriter</span>
      <span class="title-sep" aria-hidden="true"></span>
      <input id="title-input" class="title-input" type="text" value="Untitled" aria-label="Script title" spellcheck="false" />
      <span class="topbar-spacer"></span>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <button id="btn-export" class="btn btn-ghost" title="Export PDF (Ctrl+P)">PDF</button>
      <button id="btn-theme" class="icon-btn" aria-label="Toggle dark/light theme" title="Toggle theme"></button>
      <button id="btn-focus" class="icon-btn" aria-label="Toggle focus mode" title="Focus mode (Ctrl+E)"></button>
      <button id="btn-help" class="icon-btn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"></button>
    </header>

    <div id="main" class="main">
      <aside id="sidebar" class="sidebar">
        <section id="projects-panel" class="panel collapsed" aria-label="Projects"></section>
        <section id="outline-panel" class="panel collapsed" aria-label="Scene outline"></section>
        <section id="stats-panel" class="panel collapsed" aria-label="Statistics"></section>
        <section id="insert-panel" class="panel collapsed" aria-label="Insert"></section>
        <section id="export-panel" class="panel collapsed" aria-label="Export"></section>
        <input id="file-input" type="file" hidden accept=".fountain,.txt,.json,text/plain,application/json" multiple />
      </aside>

      <main id="workspace" class="workspace">
        <div id="editor" class="editor-scroll">
          <div id="doc" class="doc">
            <div id="pages" class="pages"></div>
            <div id="render" class="render-layer" aria-hidden="true"></div>
            <textarea id="input" class="input-layer" wrap="soft" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-label="Screenplay editor"></textarea>
            <div id="autocomplete" class="autocomplete" role="listbox" aria-label="Autocomplete" hidden></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/caret.js"></script>
  <script src="js/fountain.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/files.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
